quarkus.application.name=quarkforge-sample-user-service
quarkus.http.port=8081

# ---------- 数据源：示例使用内存 H2，生产替换为 MySQL/PostgreSQL ----------
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:qf_sample;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=false

# ---------- JWT：示例使用仓库内的演示密钥，生产请替换为自有密钥并通过挂载注入 ----------
smallrye.jwt.sign.key.location=jwt/privateKey.pem
mp.jwt.verify.publickey.location=jwt/publicKey.pem
mp.jwt.verify.issuer=quarkforge
quarkforge.jwt.issuer=quarkforge
quarkforge.jwt.ttl-minutes=120

# ---------- 框架 ----------
quarkforge.data.worker-id=1
quarkforge.web.response.auto-wrap=true
quarkforge.web.access-log.enabled=true

# ---------- OpenAPI ----------
quarkus.smallrye-openapi.info-title=QuarkForge Sample User Service
quarkus.smallrye-openapi.info-version=1.0.0
