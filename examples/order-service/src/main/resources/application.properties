quarkus.application.name=quarkforge-sample-order-service
quarkus.http.port=8082

# ---------- gRPC 客户端：指向 user-service 的 gRPC 端口 ----------
quarkus.grpc.clients.user.host=localhost
quarkus.grpc.clients.user.port=9001

# ---------- 数据源：示例使用内存 H2 ----------
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:qf_order;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=false

# ---------- 框架 ----------
quarkforge.data.worker-id=2
quarkforge.web.response.auto-wrap=true
quarkforge.web.access-log.enabled=true

# ---------- OpenAPI ----------
quarkus.smallrye-openapi.info-title=QuarkForge Sample Order Service
quarkus.smallrye-openapi.info-version=1.0.0
