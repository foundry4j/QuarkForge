quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:qf_order_test;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# 测试时使用 in-process gRPC：同 JVM 内启动 TestUserService 作为 user-service 的桩实现
quarkus.grpc.clients.user.in-process=enabled

quarkforge.audit.enabled=false
