# QuarkForge Scheduler — 默认低优先级配置，业务 application.properties 可覆盖
# ---------------------------------------------------------------------------

# 任务处理服务器默认开启：让调度进来的 job 能立即被执行
quarkus.jobrunr.background-job-server.enabled=true

# 开发友好的轮询间隔（生产建议 15-30s）
quarkus.jobrunr.background-job-server.poll-interval=5

# 默认重试次数
quarkus.jobrunr.jobs.default-number-of-retries=3

# 任务保留策略：成功 36h 后删除、软删 72h 后物理删
quarkus.jobrunr.jobs.delete-succeeded-jobs-after=36h
quarkus.jobrunr.jobs.permanently-delete-deleted-jobs-after=72h

# 停止时等待正在运行的任务最多 10s
quarkus.jobrunr.background-job-server.interrupt-jobs-await-duration-on-stop=10s

# Dashboard 默认关闭，生产需显式开启并加鉴权
quarkus.jobrunr.dashboard.enabled=false

# 匿名统计默认关闭
quarkus.jobrunr.miscellaneous.allow-anonymous-data-usage=false
